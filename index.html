
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Player</title>

  <!-- Enables cross-origin isolation where supported -->
  <script src="./coi-serviceworker.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <iframe
    src="https://vel.gg/bo1z/"
    allow="fullscreen; autoplay; gamepad"
    allowfullscreen>
  </iframe>

  <a href="#0" id="pop1btn" class="cd-popup-trigger"
     onclick="openpopup('pop1')">View Pop-up 1</a>

  <a href="#0" class="cd-popup-trigger"
     onclick="openpopup('pop2')">View Pop-up 2</a>

  <div id="pop1" class="cd-popup" role="alert">
    <div class="cd-popup-container">
      <p>Are you sure you want to delete this element 1?</p>
      <a href="#0" class="cd-popup-close"></a>
    </div>
  </div>

  <div id="pop2" class="cd-popup" role="alert">
    <div class="cd-popup-container">
      <p>Are you sure you want to delete this element 2?</p>
      <a href="#0" class="cd-popup-close"></a>
    </div>
  </div>
</body>
</html>
